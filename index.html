<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>큐티일기</title>
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="큐티일기">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>큐티일기</h1>
  <nav class="tabs">
    <button data-tab="write" class="active">작성</button>
    <button data-tab="list">모아보기</button>
    <button data-tab="settings">설정</button>
  </nav>
</header>

<main>
  <!-- 작성 -->
  <section id="tab-write" class="tab">
    <div class="card meta">
      <div class="row">
        <label class="f-group">조<input id="f-group" inputmode="numeric" autocomplete="off"></label>
        <label class="f-name">이름<input id="f-name" autocomplete="off"></label>
      </div>
      <label>날짜<input id="f-date" type="date"></label>
      <label>본문<input id="f-passage" placeholder="예) 요한복음 3:16-21" autocomplete="off"></label>
      <label>제목<input id="f-title" autocomplete="off"></label>
    </div>

    <div class="card">
      <label class="sec">요약<textarea id="f-summary" rows="4"></textarea></label>
      <label class="sec">묵상<textarea id="f-meditation" rows="5"></textarea></label>
      <label class="sec">적용<textarea id="f-application" rows="4"></textarea></label>
      <label class="sec">기도<textarea id="f-prayer" rows="4"></textarea></label>
    </div>

    <p class="status" id="save-status"></p>

    <div class="actions">
      <button id="btn-new" class="ghost">새로 쓰기</button>
      <button id="btn-export" class="primary">미리보기 · 내보내기</button>
    </div>
  </section>

  <!-- 모아보기 -->
  <section id="tab-list" class="tab" hidden>
    <div id="week-list"></div>
    <p class="empty" id="list-empty" hidden>아직 작성한 큐티가 없어요.</p>
  </section>

  <!-- 설정 -->
  <section id="tab-settings" class="tab" hidden>
    <div class="card">
      <h2>기본 정보</h2>
      <p class="hint">새로 쓸 때 자동으로 채워져요.</p>
      <div class="row">
        <label class="f-group">조<input id="s-group" inputmode="numeric" autocomplete="off"></label>
        <label class="f-name">이름<input id="s-name" autocomplete="off"></label>
      </div>
      <label>한 주의 시작
        <select id="s-weekstart">
          <option value="1">월요일</option>
          <option value="0">일요일</option>
        </select>
      </label>
    </div>
    <div class="card">
      <h2>백업</h2>
      <p class="hint">작성한 내용은 이 기기 브라우저에만 저장돼요. 폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업해 두세요.</p>
      <div class="actions">
        <button id="btn-backup" class="ghost">백업 파일 저장</button>
        <button id="btn-restore" class="ghost">백업 불러오기</button>
        <input id="restore-file" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<!-- 내보내기 모달 -->
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <strong id="modal-title">미리보기</strong>
      <button id="modal-close" class="icon" aria-label="닫기">✕</button>
    </div>
    <div id="preview" class="preview"></div>
    <div id="export-buttons" class="export-buttons">
      <div class="ex-row">
        <span>PDF</span>
        <button data-kind="pdf" data-act="share" class="share-btn">공유</button>
        <button data-kind="pdf" data-act="save">저장</button>
      </div>
      <div class="ex-row">
        <span>사진</span>
        <button data-kind="png" data-act="share" class="share-btn">공유</button>
        <button data-kind="png" data-act="save">저장</button>
      </div>
    </div>
    <p id="modal-status" class="status"></p>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
